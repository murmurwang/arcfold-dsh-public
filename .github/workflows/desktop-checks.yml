name: Desktop 离线检查
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the older run; manual runs never cancel.
concurrency:
  group: desktop-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop:
    # tree-e2e alone takes about as long as all other files together, so it
    # runs in its own job. Every test file runs in exactly one of the two jobs.
    name: Desktop checks (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [tree-e2e, rest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: 核对检查使用的提交
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: 取得并校验 Desktop 随包提供的计数环境
        shell: bash
        run: |
          package="$RUNNER_TEMP/arcfold-test-package"
          archive="$package/runtime/desktop-python.tar.gz"
          mkdir -p "$package/runtime"
          url="$(node --input-type=module -e "import { desktopPython } from './src/desktop/python-runtime.mjs'; console.log(desktopPython.url)")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --output "$archive" "$url"
          python="$(node --input-type=module -e "import { prepareBundledDesktopPython } from './src/desktop/python-runtime.mjs'; console.log(prepareBundledDesktopPython(process.argv[1], process.argv[2]))" "$package" "$RUNNER_TEMP")"
          echo "ARCFOLD_DESKTOP_PYTHON_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "ARCFOLD_TREE_ENCODING_PYTHON=$python" >> "$GITHUB_ENV"
      - name: 安装锁定依赖，不运行安装脚本
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 在独立副本运行 Desktop 模拟检查
        env:
          ARCFOLD_PATCH_TEST_INSTALLATION: ${{ github.workspace }}
          ARCFOLD_DESKTOP_PACKAGE_SOURCE: ${{ github.workspace }}
          ARCFOLD_DESKTOP_PACKAGE_DEPENDENCIES: ${{ github.workspace }}
          DSH_TELEMETRY_DISABLED: '1'
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for file in test/*.test.mjs; do
            if [ "$SHARD" = tree-e2e ] && [ "$file" = test/tree-e2e.test.mjs ]; then files+=("$file"); fi
            if [ "$SHARD" = rest ] && [ "$file" != test/tree-e2e.test.mjs ]; then files+=("$file"); fi
          done
          test "${#files[@]}" -gt 0
          echo "Running ${#files[@]} test files in shard $SHARD"
          node scripts/test-isolated.mjs "${files[@]}"
